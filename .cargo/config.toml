diff -ruN orig/filmcraft-main/crates/hevc/tests/it/yuv422.rs filmcraft-main/crates/hevc/tests/it/yuv422.rs
--- orig/filmcraft-main/crates/hevc/tests/it/yuv422.rs	1970-01-01 00:00:00.000000000 +0000
+++ filmcraft-main/crates/hevc/tests/it/yuv422.rs	2026-10-25 23:56:45.778861738 +0000
@@ -0,0 +1,173 @@
+//! HEVC Main 4:2:2 10 (RExt without range-extension tools): bit-exactness against ffmpeg's decode
+//! of libx265 streams (skipped when ffmpeg or libx265 is absent). Camera originals (Sony XAVC HS,
+//! Panasonic, Canon, Fujifilm) are this profile.
+
+use crate::common;
+use filmcraft_hevc::{Picture, Plane};
+use std::path::PathBuf;
+use std::process::Command;
+
+struct Fixture422 {
+    name: &'static str,
+    source: &'static str,
+    width: usize,
+    height: usize,
+    frames: u32,
+    filter: &'static str,
+    x265: &'static str,
+}
+
+const NOISE: &str = "noise=alls=12:allf=t+u";
+
+const FIXTURES: &[Fixture422] = &[
+    Fixture422 { name: "intra_422_10", source: "testsrc2", width: 352, height: 288, frames: 3, filter: NOISE, x265: "keyint=1:log-level=error" },
+    Fixture422 { name: "intra_422_10_nosao_nodbk", source: "testsrc2", width: 352, height: 288, frames: 2, filter: NOISE, x265: "keyint=1:no-sao=1:no-deblock=1:log-level=error" },
+    Fixture422 { name: "medium_422_10", source: "testsrc2", width: 352, height: 288, frames: 20, filter: NOISE, x265: "log-level=error" },
+    Fixture422 { name: "bframes_422_10", source: "testsrc2", width: 352, height: 288, frames: 30, filter: NOISE, x265: "bframes=8:b-pyramid=1:ref=4:rect=1:amp=1:log-level=error" },
+    Fixture422 { name: "tu4_422_10", source: "mandelbrot", width: 352, height: 288, frames: 8, filter: NOISE, x265: "ctu=32:tu-intra-depth=4:tu-inter-depth=4:max-tu-size=16:log-level=error" },
+    Fixture422 { name: "deblock_422_10", source: "testsrc2", width: 352, height: 288, frames: 12, filter: NOISE, x265: "deblock=-3,3:log-level=error" },
+    Fixture422 { name: "weightp_422_10", source: "testsrc2", width: 352, height: 288, frames: 20, filter: "fade=in:0:18", x265: "weightp=1:weightb=1:log-level=error" },
+    Fixture422 { name: "cu_lossless_422_10", source: "testsrc2", width: 176, height: 144, frames: 6, filter: NOISE, x265: "cu-lossless=1:log-level=error" },
+    Fixture422 { name: "qp1_422_10", source: "mandelbrot", width: 176, height: 144, frames: 4, filter: NOISE, x265: "qp=1:log-level=error" },
+    Fixture422 { name: "odd_1918x1078_422_10", source: "testsrc2", width: 1918, height: 1078, frames: 3, filter: NOISE, x265: "log-level=error" },
+    Fixture422 { name: "hd_1080p_422_10", source: "testsrc2", width: 1920, height: 1080, frames: 3, filter: "", x265: "log-level=error" },
+];
+
+fn dir() -> PathBuf {
+    filmcraft_testkit::fixtures_dir("hevc")
+}
+
+fn run(cmd: &mut Command) -> bool {
+    matches!(cmd.output(), Ok(o) if o.status.success())
+}
+
+/// Generate (if needed) the stream and ffmpeg's yuv422p10le decode of it.
+fn ensure(f: &Fixture422) -> Option<(PathBuf, PathBuf)> {
+    let ff = filmcraft_testkit::ffmpeg_or_skip(f.name)?;
+    let (hevc, yuv) = (dir().join(format!("{}.hevc", f.name)), dir().join(format!("{}.yuv", f.name)));
+    if !hevc.exists() {
+        let tmp = filmcraft_testkit::temp_path(&hevc);
+        let mut vf = format!("{}=size={}x{}:rate=25,format=yuv422p10le", f.source, f.width, f.height);
+        if !f.filter.is_empty() {
+            vf.push(',');
+            vf.push_str(f.filter);
+        }
+        let mut c = Command::new(&ff);
+        c.args(["-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", &vf, "-frames:v", &f.frames.to_string()]);
+        c.args(["-c:v", "libx265", "-pix_fmt", "yuv422p10le", "-profile:v", "main422-10", "-x265-params", f.x265, "-f", "hevc"]).arg(&tmp);
+        if !run(&mut c) {
+            let _ = std::fs::remove_file(&tmp);
+            eprintln!("SKIPPED ({}): libx265 4:2:2 encoder unavailable", f.name);
+            return None;
+        }
+        std::fs::rename(&tmp, &hevc).ok()?;
+    }
+    if !yuv.exists() {
+        let tmp = filmcraft_testkit::temp_path(&yuv);
+        let mut c = Command::new(&ff);
+        c.args(["-hide_banner", "-loglevel", "error", "-y", "-i"]).arg(&hevc);
+        c.args(["-fps_mode", "passthrough", "-f", "rawvideo", "-pix_fmt", "yuv422p10le"]).arg(&tmp);
+        assert!(run(&mut c), "reference decode failed for {}", f.name);
+        std::fs::rename(&tmp, &yuv).ok()?;
+    }
+    Some((hevc, yuv))
+}
+
+/// Compare pictures with a raw yuv422p10le reference: planes are w x h, w/2 x h and w/2 x h.
+fn compare(pics: &[Picture], reference: &[u8], w: usize, h: usize) -> Result<(), String> {
+    let (cw, ch) = (w.div_ceil(2), h);
+    let fsize = (w * h + 2 * cw * ch) * 2;
+    let nref = reference.len() / fsize;
+    if pics.len() != nref {
+        return Err(format!("decoder produced {} frames, reference has {nref}", pics.len()));
+    }
+    for (i, p) in pics.iter().enumerate() {
+        if (p.width as usize, p.height as usize) != (w, h) {
+            return Err(format!("frame {i}: size {}x{} != {w}x{h}", p.width, p.height));
+        }
+        if p.chroma_format_idc != 2 || (p.chroma_width as usize, p.chroma_height as usize) != (cw, ch) {
+            return Err(format!("frame {i}: chroma {}x{} (idc {}) != {cw}x{ch} (idc 2)", p.chroma_width, p.chroma_height, p.chroma_format_idc));
+        }
+        let f = &reference[i * fsize..(i + 1) * fsize];
+        let (ys, cs) = (w * h * 2, cw * ch * 2);
+        let planes: [(&str, &Plane, &[u8], usize, usize); 3] = [("Y", &p.y, &f[..ys], w, h), ("U", &p.u, &f[ys..ys + cs], cw, ch), ("V", &p.v, &f[ys + cs..], cw, ch)];
+        for (name, got, exp, pw, ph) in planes {
+            for y in 0..ph {
+                for x in 0..pw {
+                    let k = y * pw + x;
+                    let want = u16::from_le_bytes([exp[2 * k], exp[2 * k + 1]]);
+                    if got.get(k) != want {
+                        return Err(format!("frame {i} (poc {}) plane {name}: first mismatch at ({x},{y}): got {} want {want}", p.poc, got.get(k)));
+                    }
+                }
+            }
+        }
+    }
+    Ok(())
+}
+
+fn check(name: &str) {
+    let f = FIXTURES.iter().find(|f| f.name == name).expect("fixture");
+    let Some((hevc, yuv)) = ensure(f) else { return };
+    let reference = std::fs::read(&yuv).expect("reference yuv");
+    for threads in [1, 3, 0] {
+        let pics = match common::decode_file_threads(&hevc, threads) {
+            Ok(p) => p,
+            Err((au, e, _)) => panic!("{name} (threads {threads}): decode error at access unit {au}: {e}"),
+        };
+        compare(&pics, &reference, f.width, f.height).unwrap_or_else(|e| panic!("{name} (threads {threads}): {e}"));
+        common::check_pts(&pics).unwrap_or_else(|e| panic!("{name} (threads {threads}): {e}"));
+    }
+}
+
+macro_rules! tests_422 {
+    ($($name:ident),* $(,)?) => { $( #[test] fn $name() { check(stringify!($name)); } )* };
+}
+
+tests_422!(
+    intra_422_10,
+    intra_422_10_nosao_nodbk,
+    medium_422_10,
+    bframes_422_10,
+    tu4_422_10,
+    deblock_422_10,
+    weightp_422_10,
+    cu_lossless_422_10,
+    qp1_422_10,
+    odd_1918x1078_422_10,
+    hd_1080p_422_10,
+);
+
+/// Damaged 4:2:2 streams (bit flips, truncation) never panic.
+#[test]
+fn hostile_422_streams_never_panic() {
+    let Some((hevc, _)) = ensure(&FIXTURES[0]) else { return };
+    let data = std::fs::read(hevc).expect("stream");
+    let aus = common::split_access_units(&data);
+    let mut seed = 0x9e37_79b9_7f4a_7c15u64;
+    let mut next = || {
+        seed ^= seed << 13;
+        seed ^= seed >> 7;
+        seed ^= seed << 17;
+        seed
+    };
+    for round in 0..64 {
+        let mut dec = filmcraft_hevc::Decoder::new();
+        for (i, au) in aus.iter().enumerate() {
+            let mut bytes = au.to_vec();
+            if !bytes.is_empty() && (round + i) % 2 == 0 {
+                for _ in 0..4 {
+                    let at = (next() as usize) % bytes.len();
+                    bytes[at] ^= 1 << (next() % 8);
+                }
+                if round % 3 == 0 {
+                    bytes.truncate((next() as usize) % bytes.len() + 1);
+                }
+            }
+            let r = std::panic::catch_unwind(std::panic::AssertUnwindSafe(|| {
+                let _ = dec.decode(&bytes, i as i64);
+            }));
+            assert!(r.is_ok(), "panic decoding a damaged 4:2:2 stream (round {round}, access unit {i})");
+        }
+    }
+}
