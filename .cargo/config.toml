+    /// A 4:2:2 frame keeps full-height, half-width chroma planes and crops them exactly
+    /// (SubHeightC = 1: no vertical halving of the crop window).
+    #[test]
+    fn chroma_422_geometry_and_crop() {
+        let (w, h) = (40usize, 36usize);
+        let crop = (2usize, 5usize, 33usize, 27usize);
+        let bd = 10u32;
+        let (y, _, _) = planes(w, h, bd, 0x1234_5678_9abc_def1);
+        let (cwid, chei) = (w / 2, h);
+        let (_, cb, cr): (Vec<u16>, Vec<u16>, Vec<u16>) = {
+            let (_, a, _) = planes(cwid * 2, chei * 2, bd, 7);
+            let (_, b, _) = planes(cwid * 2, chei * 2, bd, 11);
+            (Vec::new(), a[..cwid * chei].to_vec(), b[..cwid * chei].to_vec())
+        };
+        let like = Frame::with_chroma(0, 0, w, h, 4, bd, bd, (1, 0));
+        assert_eq!((like.cwidth, like.cheight), (cwid, chei));
+        let f = Frame::from_planes(1, 0, &like, &y, &cb, &cr);
+        assert!(f.is_complete());
+        let (_, pu, pv) = f.cropped_planes(crop, false);
+        let (cx, cy, cw, ch) = crop;
+        let (ccw, cch) = (cw.div_ceil(2), ch);
+        let want = |p: &[u16]| -> Vec<u16> { (cy..cy + cch).flat_map(|r| p[r * cwid + cx / 2..r * cwid + cx / 2 + ccw].to_vec()).collect() };
+        let got = |p: &Plane| -> Vec<u16> { (0..p.len()).map(|i| p.get(i)).collect() };
+        assert_eq!(got(&pu), want(&cb), "cb");
+        assert_eq!(got(&pv), want(&cr), "cr");
+        // a grey frame of the same geometry has full-height chroma rows too
+        let g = Frame::gray(2, 0, &like);
+        assert!(g.is_complete());
+        assert_eq!((g.cwidth, g.cheight, g.csx, g.csy), (cwid, chei, 1, 0));
+    }
